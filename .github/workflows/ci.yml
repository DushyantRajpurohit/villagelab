name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # No DATABASE_URL and no Supercell token: the suite runs entirely against
      # the deterministic mock generator.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
